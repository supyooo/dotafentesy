# Cloudflare Pages «dota-fantasy»: статика — prototype/, API — functions/ (вход через Telegram, подписка, прогресс).
# Деплой как раньше: npx wrangler pages deploy prototype --project-name dota-fantasy --branch main (D:\dev\deploy-site.ps1).
# Секреты (не в репозитории): npx wrangler pages secret put TELEGRAM_BOT_TOKEN --project-name dota-fantasy
#                             и SESSION_SECRET (случайная строка) — docs/10 «Вход и сохранение».
name = "dota-fantasy"
pages_build_output_dir = "prototype"
compatibility_date = "2026-10-01"

[vars]
# канал или группа, подписка на которые открывает игру: username без @ (публичные) или числовой id -100… (приватные);
# TG_LINK — ссылка для кнопки «Подписаться» (у приватной — приглашение t.me/+…), TG_TITLE — название для экрана входа;
# TG_BOT — username бота для виджета входа (у бота — /setdomain dota-fantasy.pages.dev, бот — администратор канала)
TG_CHANNEL = "-1004421337640"
TG_LINK = "https://t.me/+8j69D4AiXSU3N2M6"
TG_TITLE = "Медийка киберспорт"
TG_BOT = "Fantasy_Dota2_bot"

[[d1_databases]]
binding = "DB"
database_name = "dota-fantasy"
database_id = "ac2cb7a4-5ebe-4479-95b6-63a3213fb967"
